<text x="72" y="32" class="title">Land water storage and El Niño</text>
<text x="72" y="54" class="subtitle">Land outside the ice sheets, seasons removed: COST-G GRACE and GRACE-FO, km³ relative to 2004–2009. Shading: Niño 3.4 above +1 °C.</text>
<text x="72" y="72" class="subtitle">Black: observed. Blue: trend plus the Niño 3.4 level model (in-sample fit), then its forecast median and 90% range to June 2027,</text>
<text x="72" y="90" class="subtitle">committed as a git tag before those months were observed.</text>
