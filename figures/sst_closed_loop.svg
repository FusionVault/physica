<text x="92" y="54" class="subtitle">Error per degree, mm of equivalent water height, of one month recovered from simulated noise only (single pair, 89°, 463 km, 200 km apart,</text>
<text x="92" y="72" class="subtitle">30 s sampling, degree 40, whitened least squares). Compare Zingerle et al. (2024), Fig. 2a; time-variable gravity and aliasing are not simulated.</text>
