<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 592" width="960" height="592" role="img" aria-label="Each proposal against general relativity and experiment">
<title>Each proposal against general relativity and experiment</title>
<style>
svg { color-scheme: light; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; }
@media (prefers-color-scheme: dark) { svg:where(:not([data-theme="light"])) { color-scheme: dark; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; } }
svg[data-theme="dark"] { color-scheme: dark; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781; --grid: #2c2c2a; --axis: #383835; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; }
text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 12px; font-variant-numeric: tabular-nums; }
.title { fill: var(--ink); font-size: 18px; font-weight: 600; font-variant-numeric: normal; }
.subtitle { font-size: 13px; font-variant-numeric: normal; }
.panel { fill: var(--ink); font-size: 14px; font-weight: 600; }
.tick { fill: var(--muted); }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--axis); stroke-width: 1; }
.line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ink { stroke: var(--ink); } .ink2 { stroke: var(--ink2); } .muted { stroke: var(--muted); }
.s1 { stroke: var(--s1); } .s2 { stroke: var(--s2); } .s3 { stroke: var(--s3); } .s4 { stroke: var(--s4); }
.s5 { stroke: var(--s5); } .s6 { stroke: var(--s6); } .s7 { stroke: var(--s7); }
</style>
<rect width="960" height="592" fill="var(--surface)"/>
<text x="24" y="34" class="title">Each proposal against general relativity and experiment</text>
<text x="24" y="56" class="subtitle">Each proposal's own numbers, divided by what general relativity, the measurements or its own model give. Log scale: each gridline is 10⁵.</text>
<line x1="360.0" y1="108.0" x2="360.0" y2="548.0" class="grid"/><text x="360.0" y="100.0" class="tick" text-anchor="middle">1</text>
<line x1="478.2" y1="108.0" x2="478.2" y2="548.0" class="grid"/><text x="478.2" y="100.0" class="tick" text-anchor="middle">10⁵</text>
<line x1="596.4" y1="108.0" x2="596.4" y2="548.0" class="grid"/><text x="596.4" y="100.0" class="tick" text-anchor="middle">10¹⁰</text>
<line x1="714.5" y1="108.0" x2="714.5" y2="548.0" class="grid"/><text x="714.5" y="100.0" class="tick" text-anchor="middle">10¹⁵</text>
<line x1="832.7" y1="108.0" x2="832.7" y2="548.0" class="grid"/><text x="832.7" y="100.0" class="tick" text-anchor="middle">10²⁰</text>
<text x="24" y="134.0" style="fill: var(--ink); font-weight: 600">Tajmar: frame dragging near a spinning superconductor</text><text x="24" y="151.0" class="tick">reported ÷ general relativity</text>
<rect x="360" y="129.0" width="509.7" height="14" rx="4" fill="var(--s1)"><title>Tajmar: frame dragging near a spinning superconductor: 3.7×10²¹</title></rect><text x="877.7" y="141.0" style="fill: var(--ink)">3.7×10²¹</text>
<text x="24" y="186.0" style="fill: var(--ink); font-weight: 600">Li–Baker: detecting a GHz gravitational wave</text><text x="24" y="203.0" class="tick">shot-noise time (standard rate) ÷ claimed time</text>
<rect x="360" y="181.0" width="355.0" height="14" rx="4" fill="var(--s1)"><title>Li–Baker: detecting a GHz gravitational wave: 1.0×10¹⁵</title></rect><text x="723.0" y="193.0" style="fill: var(--ink)">1.0×10¹⁵</text>
<text x="24" y="238.0" style="fill: var(--ink); font-weight: 600">Podkletnov: impulse-generator pendulum</text><text x="24" y="255.0" class="tick">momentum ÷ the momentum of radiation with that energy</text>
<rect x="360" y="233.0" width="214.6" height="14" rx="4" fill="var(--s1)"><title>Podkletnov: impulse-generator pendulum: 1.2×10⁹</title></rect><text x="582.6" y="245.0" style="fill: var(--ink)">1.2×10⁹</text>
<text x="24" y="290.0" style="fill: var(--ink); font-weight: 600">Pais: charged-disc wave source</text><text x="24" y="307.0" class="tick">surface field ÷ the breakdown limit his patent states</text>
<rect x="360" y="285.0" width="159.6" height="14" rx="4" fill="var(--s1)"><title>Pais: charged-disc wave source: 5.6×10⁶</title></rect><text x="527.6" y="297.0" style="fill: var(--ink)">5.6×10⁶</text>
<text x="24" y="342.0" style="fill: var(--ink); font-weight: 600">Podkletnov: weight loss above a spinning disc</text><text x="24" y="359.0" class="tick">reported ÷ strictest replication bound</text>
<rect x="360" y="337.0" width="142.3" height="14" rx="4" fill="var(--s1)"><title>Podkletnov: weight loss above a spinning disc: 1.1×10⁶</title></rect><text x="510.3" y="349.0" style="fill: var(--ink)">1.1×10⁶</text>
<text x="24" y="394.0" style="fill: var(--ink); font-weight: 600">Woodward: Mach-effect thruster</text><text x="24" y="411.0" class="tick">reported thrust ÷ his own formula in SI</text>
<rect x="360" y="389.0" width="31.2" height="14" rx="4" fill="var(--s1)"><title>Woodward: Mach-effect thruster: 21</title></rect><text x="399.2" y="401.0" style="fill: var(--ink)">21</text>
<text x="24" y="446.0" style="fill: var(--ink); font-weight: 600">EmDrive (Eagleworks)</text><text x="24" y="463.0" class="tick">claimed thrust per watt ÷ a photon rocket</text>
<rect x="360" y="441.0" width="60.4" height="14" rx="4" fill="var(--s1)"><title>EmDrive (Eagleworks): 360</title></rect><text x="428.4" y="453.0" style="fill: var(--ink)">360</text>
<text x="24" y="498.0" style="fill: var(--ink); font-weight: 600">Podkletnov: impulse-generator charge</text><text x="24" y="515.0" class="tick">charge needed ÷ what its Marx bank holds</text>
<rect x="360" y="493.0" width="37.9" height="14" rx="4" fill="var(--s1)"><title>Podkletnov: impulse-generator charge: 40</title></rect><text x="405.9" y="505.0" style="fill: var(--ink)">40</text>
<line x1="360" y1="108.0" x2="360" y2="548.0" class="axis"/>
<text x="24" y="576.0" class="tick">From the gravitics crate, whose tests pin every number. Sources in the research report.</text>
</svg>
