[package]
name = "geopotential"
version = "0.3.1"
description = "Earth's gravity field from spherical harmonics: read ICGEM .gfc models, then compute gravity, geoid, gradients and water height at a point or on a map, stable to degree 2700."
keywords = ["geodesy", "gravity", "spherical-harmonics", "geoid", "icgem"]
categories = ["science::geo", "mathematics"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
metrology = { path = "../metrology", version = "0.2.0" }
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Serialize/Deserialize for Coefficients and TideSystem (deserialization checks array lengths).
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true

[[example]]
name = "sun_synchronous_orbit"
test = true
