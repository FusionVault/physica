[package]
name = "geopotential"
version = "0.1.2"
description = "Earth's gravity field from spherical harmonics: gravity, geoid and water height at a point or on a map, stable to degree 2700."
keywords = ["geodesy", "gravity", "spherical-harmonics", "geoid", "grace"]
categories = ["science::geo", "mathematics"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Serialize/Deserialize for Coefficients and TideSystem (deserialization checks array lengths).
serde = ["dep:serde"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
