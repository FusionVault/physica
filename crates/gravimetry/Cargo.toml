[package]
name = "gravimetry"
version = "0.6.0"
description = "Satellite gravimetry: mission and sensor noise (electrostatic and cold-atom accelerometers, laser ranging, gradiometers), closed-loop simulation, GRACE processing (technical notes, smoothing, stripe removal, water height), earthquake gravity, a Kalman smoother and atmospheric waves."
keywords = ["geodesy", "grace", "hydrology", "gravimetry", "earthquake"]
categories = ["science::geo"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
geopotential = { path = "../geopotential", version = "0.3.0" }
metrology = { path = "../metrology", version = "0.2.0" }

[lints]
workspace = true

[[example]]
name = "ice_and_sea_level"
test = true

