<title>Gravity Orrery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an instrument console. The 3D stage fills the left; a narrow readout column on the
   right (below on phones) carries the controls and the numbers, each tagged with the crate that
   computed it. One deliberate dark look: a model of space. */
:root {
  color-scheme: dark;
  --bg: #060a12;
  --stage: #03060c;
  --panel: #0c1220;
  --line: #1c2740;
  --ink: #e6ecf7;
  --ink2: #9fb0cc;
  --muted: #6b7b98;
  --orbit: #5fd0ff;
  --wave: #ffb347;
  --field: #d17bff;
  --good: #7be0a6;
  --accent: #ffcf6e;
  --display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--body); }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr); height: 100%; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; padding-block: 12px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
h1 { font: 700 26px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; margin: 0; }
h1 span { color: var(--accent); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { font: 500 15px var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 4px 12px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); }
.tabs button:focus-visible, .panel button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stage { position: relative; min-height: 0; background: var(--stage); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.hint { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: 10px; color: var(--muted); font: 12px var(--mono); pointer-events: none; }
.legend { position: absolute; right: 12px; top: 10px; display: grid; gap: 4px; font: 12px var(--mono); color: var(--ink2); pointer-events: none; text-align: right; }
.legend i { display: inline-block; width: 18px; height: 3px; vertical-align: middle; margin-left: 6px; border-radius: 2px; }
.panel { min-height: 0; overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding-block: 14px 24px; padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
.panel h2 { font: 700 20px/1.1 var(--display); letter-spacing: 0.05em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.panel p { margin: 0; color: var(--ink2); max-width: 60ch; }
.control { display: grid; gap: 4px; }
.control label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink2); }
.control output { font: 13px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.panel button { font: 500 13px var(--body); color: var(--ink); background: #16203a; border: 1px solid var(--line); border-radius: 3px; padding: 5px 12px; cursor: pointer; }
.panel button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
dl { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; }
dt { color: var(--ink2); font-size: 13px; }
dd { margin: 0; font: 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
dd small { display: block; color: var(--muted); font-size: 11px; }
.crate { font: 11px var(--mono); color: var(--muted); letter-spacing: 0.04em; }
.note { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }
.sens { width: 100%; height: auto; }
.sens text { font: 10px var(--mono); fill: var(--ink2); }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 58vh auto; height: auto; }
  .panel { border-left: none; border-top: 1px solid var(--line); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
</style>

<div class="app">
  <header>
    <h1>Gravity <span>Orrery</span></h1>
    <nav class="tabs" role="tablist" aria-label="Scenes">
      <button role="tab" id="tab-earth" aria-selected="true" data-scene="earth">Earth</button>
      <button role="tab" id="tab-waves" aria-selected="false" data-scene="waves">Waves</button>
      <button role="tab" id="tab-plasma" aria-selected="false" data-scene="plasma">Plasma</button>
      <button role="tab" id="tab-warp" aria-selected="false" data-scene="warp">Warp</button>
    </nav>
  </header>
  <div class="stage" id="stage">
    <div class="legend" id="legend"></div>
    <div class="hint">drag to turn · scroll or pinch to zoom</div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<script type="application/json" id="atlas-data">__ATLAS_DATA__</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
const D = JSON.parse(document.getElementById('atlas-data').textContent);
const R_KM = 6371, LAMB = D.tonga.speed;
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage'), panel = document.getElementById('panel'), legend = document.getElementById('legend');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt = (v, d = 3) => {
  if (!isFinite(v)) return '—';
  const e = Math.floor(Math.log10(Math.abs(v)));
  if (e >= -2 && e < 5) return v.toFixed(Math.max(0, d - 1 - e > 6 ? 6 : Math.max(0, d - 1 - e)));
  const sup = s => String(s).replace(/[-0-9]/g, c => '⁻⁰¹²³⁴⁵⁶⁷⁸⁹'['-0123456789'.indexOf(c)]);
  return (v / 10 ** e).toFixed(d - 1) + '×10' + sup(e);
};

// ---------- renderer, camera, controls (shared) ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
stage.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 200);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

const ecef = ([x, y, z]) => new THREE.Vector3(x / R_KM, z / R_KM, -y / R_KM); // z up → three's y up
const latlon = (lat, lon, r = 1) => {
  const la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
  return new THREE.Vector3(r * Math.cos(la) * Math.cos(lo), r * Math.sin(la), -r * Math.cos(la) * Math.sin(lo));
};
const lineOf = (pts, color, opacity = 1) => new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
  new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity }));
function setLegend(items) { legend.innerHTML = items.map(([t, c]) => `<span>${t}<i style="background:${c}"></i></span>`).join(''); }

// ---------- EARTH ----------
function earthScene() {
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(5, 3, 4); scene.add(sun);
  const g = D.geoid, rows = g.rows, cols = g.cols;
  // Globe: a lat-lon mesh at the grid cell centres, coloured by geoid height, relief exaggerable.
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(rows * cols * 3), col = new Float32Array(rows * cols * 3), idx = [];
  const ramp = h => { // diverging: blue (low) → pale → amber (high), ±100 m
    const t = Math.max(-1, Math.min(1, h / 100));
    const lo = [0.16, 0.42, 0.95], mid = [0.86, 0.9, 0.95], hi = [1.0, 0.66, 0.2];
    const a = t < 0 ? lo : hi, s = Math.abs(t);
    return mid.map((m, k) => m + (a[k] - m) * s);
  };
  for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
    const k = i * cols + j, c = ramp(g.values[k]);
    col.set(c, 3 * k);
    if (i < rows - 1) { const a = k, b = k + 1 - (j === cols - 1 ? cols : 0), c2 = a + cols, d = b + cols; idx.push(a, c2, b, b, c2, d); }
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setIndex(idx);
  const globe = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  scene.add(globe);
  function relief(x) {
    for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
      const k = i * cols + j, v = latlon(-90 + g.step * (i + 0.5), -180 + g.step * (j + 0.5), 1 + x * g.values[k] / (R_KM * 1000));
      pos[3 * k] = v.x; pos[3 * k + 1] = v.y; pos[3 * k + 2] = v.z;
    }
    geo.attributes.position.needsUpdate = true; geo.computeVertexNormals();
  }
  relief(0);
  for (const ring of D.coast) scene.add(lineOf(ring.map(([lo, la]) => latlon(la, lo, 1.003)), 0x0b1424, 0.85));

  // GRACE-FO: the pair, its recent track, and the laser link.
  const O = D.orbit, C = O.c.map(ecef), Dd = O.d.map(ecef);
  const satC = new THREE.Mesh(new THREE.SphereGeometry(0.018, 12, 8), new THREE.MeshBasicMaterial({ color: css('--orbit') }));
  const satD = satC.clone(); scene.add(satC, satD);
  const trail = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: css('--orbit'), transparent: true, opacity: 0.6 }));
  const link = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xffffff }));
  scene.add(trail, link);

  // The Lamb-wave front: a small circle around Tonga at the front's angular distance.
  const tonga = latlon(D.tonga.lat, D.tonga.lon, 1).normalize();
  const front = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: css('--wave') }));
  scene.add(front);
  const marker = new THREE.Mesh(new THREE.SphereGeometry(0.02, 12, 8), new THREE.MeshBasicMaterial({ color: css('--wave') }));
  marker.position.copy(tonga.clone().multiplyScalar(1.004)); scene.add(marker);
  const u = new THREE.Vector3(0, 1, 0).cross(tonga).normalize(), w = tonga.clone().cross(u);
  const frontAngle = t => { const a = (LAMB * t / (R_KM * 1000)) % (2 * Math.PI); return a > Math.PI ? 2 * Math.PI - a : a; };
  function drawFront(theta) {
    const pts = [];
    for (let k = 0; k <= 160; k++) {
      const p = 2 * Math.PI * k / 160;
      const dir = u.clone().multiplyScalar(Math.cos(p)).add(w.clone().multiplyScalar(Math.sin(p)));
      pts.push(tonga.clone().multiplyScalar(Math.cos(theta)).add(dir.multiplyScalar(Math.sin(theta))).multiplyScalar(1.006));
    }
    front.geometry.setFromPoints(pts);
  }
  // Crossings: where the pair's midpoint meets the front, accumulated as markers.
  const crossGroup = new THREE.Group(); scene.add(crossGroup);
  const crossings = [];
  for (let k = 1; k < O.t.length; k++) {
    const m = n => C[n].clone().add(Dd[n]).normalize();
    const f = n => Math.acos(Math.max(-1, Math.min(1, m(n).dot(tonga)))) - frontAngle(O.t[n]);
    if (O.t[k] - O.t[k - 1] > 31) continue;
    const a = f(k - 1), b = f(k);
    if (a * b < 0) {
      const th = Math.acos(m(k).dot(tonga)) * 180 / Math.PI;
      if (th > 10 && th < 170) crossings.push({ t: O.t[k], p: m(k).multiplyScalar(1.01) });
    }
  }

  // LAGEOS, its orbital plane precessing (frame dragging, exaggerated).
  const lag = D.lageos, aR = lag.a_km / R_KM, inc = lag.inc_deg * Math.PI / 180;
  const lageos = new THREE.Group(); scene.add(lageos);
  const ell = [];
  for (let k = 0; k <= 200; k++) { const p = 2 * Math.PI * k / 200; ell.push(new THREE.Vector3(aR * Math.cos(p), 0, aR * Math.sin(p))); }
  const lagLine = lineOf(ell, css('--good'), 0.7); lagLine.rotation.x = inc; lageos.add(lagLine);

  const state = { t: 0, speed: 1200, relief: 0, drag: 0, playing: !reduce, shown: 0 };
  function update(dt) {
    if (state.playing) state.t = (state.t + dt * state.speed) % 86400;
    const n = Math.min(O.t.length - 1, Math.max(0, O.t.findIndex(x => x >= state.t)));
    satC.position.copy(C[n]); satD.position.copy(Dd[n]);
    link.geometry.setFromPoints([C[n], Dd[n]]);
    trail.geometry.setFromPoints(C.slice(Math.max(0, n - 190), n + 1));
    drawFront(frontAngle(state.t));
    while (crossGroup.children.length && crossings[crossGroup.children.length - 1].t > state.t) crossGroup.remove(crossGroup.children[crossGroup.children.length - 1]);
    while (crossGroup.children.length < crossings.length && crossings[crossGroup.children.length].t <= state.t) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      s.position.copy(crossings[crossGroup.children.length].p); crossGroup.add(s);
    }
    // Node angle: real rate × exaggeration, over the displayed hours.
    const node = lag.node_mas_yr * state.drag * (state.t / 3.15576e7) / 3.6e6 * Math.PI / 180;
    lageos.rotation.y = node;
    readout();
  }
  function readout() {
    const h = state.t / 3600, th = frontAngle(state.t) * 180 / Math.PI;
    document.getElementById('e-time').textContent = `${h.toFixed(2)} h after 04:14:45 UTC`;
    document.getElementById('e-front').textContent = `${th.toFixed(1)}° · ${(th * Math.PI / 180 * R_KM).toFixed(0)} km`;
    document.getElementById('e-cross').textContent = `${crossGroup.children.length} of ${crossings.length}`;
  }
  function panelHtml() {
    return `
      <div><div class="crate">geopotential · gravimetry · satgrav · geo5d</div><h2>Earth: the geoid, GRACE-FO and the Tonga wave</h2></div>
      <p>The globe is coloured by the geoid of GOCO06s: the sea-level surface of Earth's gravity, from 106 m below the ellipsoid (Indian Ocean) to 82 m above (New Guinea). GRACE-FO's two satellites fly their real orbits for the day after the Hunga Tonga eruption, linked by the laser that measures their separation to nanometres. The amber circle is the eruption's pressure wave, running around the world at ${LAMB} m/s; each white dot marks where the pair crossed it, the events the T1 test looks for.</p>
      <div class="row"><button id="e-play" aria-pressed="${state.playing}">${state.playing ? 'Pause' : 'Play'}</button><button id="e-reset">Restart</button></div>
      <div class="control"><label for="e-t">Time <output id="e-time"></output></label><input id="e-t" type="range" min="0" max="86370" step="30" value="0"></div>
      <div class="control"><label for="e-speed">Speed <output id="e-speed-o">1200×</output></label><input id="e-speed" type="range" min="1" max="4" step="0.05" value="3.08"></div>
      <div class="control"><label for="e-relief">Geoid relief <output id="e-relief-o">flat</output></label><input id="e-relief" type="range" min="0" max="8000" step="100" value="0"></div>
      <div class="control"><label for="e-drag">Frame dragging, LAGEOS <output id="e-drag-o">off</output></label><input id="e-drag" type="range" min="0" max="12" step="0.5" value="0"></div>
      <dl>
        <dt>Front from Tonga</dt><dd id="e-front"></dd>
        <dt>Crossings so far</dt><dd id="e-cross"></dd>
        <dt>Lamb-wave speed<small>gravimetry: sound at 252 K = ${D.tonga.sound_252k} m/s</small></dt><dd>${LAMB} m/s</dd>
        <dt>LAGEOS node drift<small>geo5d, Lense–Thirring</small></dt><dd>${lag.node_mas_yr} mas/yr</dd>
        <dt>T1: was the wave in the laser data?<small>pre-registered test, 21 crossings in 24 h</small></dt><dd>not detected<small>1.75 ± 1.52 hPa; 95% limit 4.3 hPa</small></dd>
      </dl>
      <p class="note">Orbits from GRACE-FO Level-1B (GNV1B), Earth-fixed, every 30 s. The pressure front is drawn at the Lamb speed measured by Wright et al. (2022). LAGEOS's plane turns by ${lag.node_mas_yr} milliarcseconds a year from the Earth's spin dragging space; the slider exaggerates it by 10ⁿ so it shows.</p>`;
  }
  function bind() {
    const t = document.getElementById('e-t');
    t.oninput = () => { state.t = +t.value; };
    document.getElementById('e-play').onclick = e => { state.playing = !state.playing; e.target.textContent = state.playing ? 'Pause' : 'Play'; e.target.setAttribute('aria-pressed', state.playing); };
    document.getElementById('e-reset').onclick = () => { state.t = 0; };
    const sp = document.getElementById('e-speed');
    sp.oninput = () => { state.speed = 10 ** +sp.value; document.getElementById('e-speed-o').textContent = `${Math.round(state.speed)}×`; };
    const rl = document.getElementById('e-relief');
    rl.oninput = () => { state.relief = +rl.value; relief(state.relief); document.getElementById('e-relief-o').textContent = state.relief ? `${state.relief}×` : 'flat'; };
    const dr = document.getElementById('e-drag');
    dr.oninput = () => { state.drag = +dr.value ? 10 ** +dr.value : 0; document.getElementById('e-drag-o').textContent = state.drag ? `×10^${dr.value}` : 'off'; };
    const loop = () => { if (active === 'earth') t.value = state.t; requestAnimationFrame(loop); }; loop();
  }
  return { scene, update, panelHtml, bind, camera: [0, 1.2, 3.4],
    legend: [['geoid low → high', 'linear-gradient(90deg,#2a6bf2,#dce6f2,#ffa833)'], ['GRACE-FO', css('--orbit')], ['Lamb wave', css('--wave')], ['LAGEOS', css('--good')]] };
}

// ---------- WAVES ----------
function wavesScene() {
  const scene = new THREE.Scene();
  const N = 64, ring = [], base = [];
  for (let i = 0; i < N; i++) {
    const p = 2 * Math.PI * i / N;
    base.push([Math.cos(p), Math.sin(p)]);
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), new THREE.MeshBasicMaterial({ color: css('--orbit') }));
    scene.add(m); ring.push(m);
  }
  const ghost = []; for (const [x, y] of base) ghost.push(new THREE.Vector3(x, y, 0));
  ghost.push(ghost[0].clone()); scene.add(lineOf(ghost, 0x334466));
  const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), new THREE.Vector3(0, 0, 1.6), 1.0, css('--wave'), 0.15, 0.08); scene.add(arrow);
  const state = { pol: 'plus', show: 0.25, phase: 0 };
  function update(dt) {
    state.phase += (reduce ? 0 : 1) * dt * 2 * Math.PI * 0.6;
    const h = state.show * Math.cos(state.phase);
    ring.forEach((m, i) => {
      const [x, y] = base[i];
      // Geodesic deviation: δx = ½h(x, −y) for +, ½h(y, x) for ×.
      const [dx, dy] = state.pol === 'plus' ? [0.5 * h * x, -0.5 * h * y] : [0.5 * h * y, 0.5 * h * x];
      m.position.set(x + dx, y + dy, 0);
    });
  }
  function svgCurves() {
    const W = 320, H = 210, L = 34, Rr = 314, T = 8, B = 186;
    const fx = f => L + (Rr - L) * (Math.log10(f) + 9) / 18, hy = h => T + (B - T) * (-17 - Math.log10(h)) / (-17 + 26);
    const path = (arr, color) => {
      let d = '';
      D.gw.freqs.forEach((f, k) => { const v = arr[k]; if (v > 0 && v < 1e-16 && v > 1e-26) d += (d ? 'L' : 'M') + fx(f).toFixed(1) + ',' + hy(v).toFixed(1); });
      return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.6"/>`;
    };
    let s = `<svg class="sens" viewBox="0 0 ${W} ${H}" role="img" aria-label="Strain sensitivity of gravitational-wave detectors">`;
    for (let e = -26; e <= -17; e += 3) s += `<line x1="${L}" x2="${Rr}" y1="${hy(10 ** e)}" y2="${hy(10 ** e)}" stroke="#1c2740"/><text x="${L - 4}" y="${hy(10 ** e) + 3}" text-anchor="end">1e${e}</text>`;
    for (const e of [-9, -3, 3, 9]) s += `<text x="${fx(10 ** e)}" y="${H - 8}" text-anchor="middle">1e${e} Hz</text>`;
    s += path(D.gw.lisa, css('--good')) + path(D.gw.aligo, css('--orbit')) + path(D.gw.et, css('--field'));
    for (const p of D.gw.points) if (p.h < 1e-16 && p.h > 1e-26 && p.f >= 1e-9 && p.f <= 1e9) s += `<circle cx="${fx(p.f)}" cy="${hy(p.h)}" r="3.2" fill="${css('--wave')}"><title>${p.name}: ${fmt(p.h)} /√Hz (${p.src})</title></circle>`;
    return s + '</svg>';
  }
  function panelHtml() {
    return `
      <div><div class="crate">gwsens · satgrav</div><h2>Waves: what a gravitational wave does</h2></div>
      <p>A ring of free test masses as a wave passes through the page. A strain h stretches one direction by ½h and squeezes the other, and the + and × polarisations do it along axes 45° apart. Real waves reaching Earth have h ≈ 10⁻²¹; the ring is exaggerated so you can see it.</p>
      <div class="row"><button id="w-plus" aria-pressed="true">+ polarisation</button><button id="w-cross" aria-pressed="false">× polarisation</button></div>
      <div class="control"><label for="w-h">Shown strain <output id="w-h-o">0.25</output></label><input id="w-h" type="range" min="0.02" max="0.5" step="0.01" value="0.25"></div>
      ${svgCurves()}
      <dl>
        <dt><span style="color:${css('--orbit')}">●</span> Advanced LIGO</dt><dd>~2×10⁻²⁴ at 200 Hz</dd>
        <dt><span style="color:${css('--field')}">●</span> Einstein Telescope</dt><dd>~10× better</dd>
        <dt><span style="color:${css('--good')}">●</span> LISA (4 yr)</dt><dd>mHz band</dd>
        ${D.gw.points.map(p => `<dt><span style="color:${css('--wave')}">●</span> ${p.name}<small>${p.src}</small></dt><dd>${fmt(p.h)} /√Hz</dd>`).join('')}
      </dl>
      <p class="note">Noise curves √S_n from gwsens (Sathyaprakash & Schutz fits, Robson et al. for LISA). GRACE-FO's laser link, read as a wave detector, and AION-km from satgrav; the high-frequency limits from gwsens's registry of published results.</p>`;
  }
  function bind() {
    const set = p => { state.pol = p; document.getElementById('w-plus').setAttribute('aria-pressed', p === 'plus'); document.getElementById('w-cross').setAttribute('aria-pressed', p === 'cross'); };
    document.getElementById('w-plus').onclick = () => set('plus');
    document.getElementById('w-cross').onclick = () => set('cross');
    const hs = document.getElementById('w-h'); hs.oninput = () => { state.show = +hs.value; document.getElementById('w-h-o').textContent = hs.value; };
  }
  return { scene, update, panelHtml, bind, camera: [0, 0.4, 4.2], legend: [['test masses', css('--orbit')], ['wave direction', css('--wave')]] };
}

// ---------- PLASMA ----------
function plasmaScene() {
  const scene = new THREE.Scene();
  const lam = D.plasma.sphere_eigenvalue; // λa for a spheromak in a sphere of radius a = 1
  const j1 = x => Math.sin(x) / (x * x) - Math.cos(x) / x;
  const j1p = x => (2 * Math.cos(x)) / (x * x) + (x * x - 2) * Math.sin(x) / (x * x * x);
  // ψ = f(r) sin²θ with f = (λr) j1(λr): the Woltjer–Taylor state, ∇×B = λB, B·n = 0 at r = a.
  const f = r => lam * r * j1(lam * r), fp = r => lam * j1(lam * r) + lam * lam * r * j1p(lam * r);
  function field(p) {
    const r = Math.max(1e-6, p.length()), cth = p.y / r, sth = Math.sqrt(Math.max(1e-12, 1 - cth * cth));
    const br = 2 * f(r) * cth / (r * r), bt = -fp(r) * sth / r, bp = lam * f(r) * sth / r;
    const phi = Math.atan2(-p.z, p.x);
    const rh = new THREE.Vector3(p.x / r, p.y / r, p.z / r);
    const th = new THREE.Vector3(cth * Math.cos(phi), -sth, -cth * Math.sin(phi));
    const ph = new THREE.Vector3(-Math.sin(phi), 0, -Math.cos(phi));
    return rh.multiplyScalar(br).add(th.multiplyScalar(bt)).add(ph.multiplyScalar(bp));
  }
  const group = new THREE.Group(); group.position.x = -1.25; scene.add(group);
  const shell = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 24), new THREE.MeshBasicMaterial({ color: 0x223355, wireframe: true, transparent: true, opacity: 0.18 }));
  group.add(shell);
  const lines = [];
  for (let s = 0; s < 14; s++) {
    const r0 = 0.25 + 0.6 * (s % 7) / 7, phi0 = 2 * Math.PI * s / 14;
    let p = new THREE.Vector3(r0 * Math.cos(phi0), 0.02 * (s % 3 - 1), -r0 * Math.sin(phi0));
    const pts = [p.clone()];
    for (let k = 0; k < 1400; k++) {
      const step = q => { const b = field(q); return b.multiplyScalar(0.012 / Math.max(1e-9, b.length())); };
      const k1 = step(p), k2 = step(p.clone().addScaledVector(k1, 0.5)), k3 = step(p.clone().addScaledVector(k2, 0.5)), k4 = step(p.clone().add(k3));
      p = p.clone().add(k1.add(k2.multiplyScalar(2)).add(k3.multiplyScalar(2)).add(k4).multiplyScalar(1 / 6));
      if (p.length() > 0.999) break;
      pts.push(p.clone());
    }
    const hue = new THREE.Color().setHSL(0.78 + 0.12 * (s / 14), 0.8, 0.62);
    const line = lineOf(pts, hue, 0.95); group.add(line); lines.push(line);
  }
  // The Z-pinch beside it: a column with azimuthal field rings, density in the Bennett profile.
  const pinch = new THREE.Group(); pinch.position.x = 1.35; scene.add(pinch);
  const col = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 2.2, 32, 1, true), new THREE.MeshBasicMaterial({ color: css('--wave'), transparent: true, opacity: 0.28 }));
  pinch.add(col);
  for (let k = 0; k < 9; k++) for (const r of [0.25, 0.4, 0.6]) {
    const pts = []; for (let q = 0; q <= 64; q++) { const a = 2 * Math.PI * q / 64; pts.push(new THREE.Vector3(r * Math.cos(a), -1 + 0.25 * k, r * Math.sin(a))); }
    pinch.add(lineOf(pts, css('--field'), 0.35 + 0.4 * (0.6 - r)));
  }
  pinch.add(new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, -1.3, 0), 2.6, 0xffffff, 0.14, 0.07));
  const state = { spin: 0 };
  function update(dt) { if (!reduce) { group.rotation.y += dt * 0.15; pinch.rotation.y += dt * 0.4; } }
  function panelHtml() {
    const p = D.plasma;
    return `
      <div><div class="crate">plasmoid</div><h2>Plasma: what a plasma settles into</h2></div>
      <p>Left: a spheromak, the state a magnetised plasma relaxes to by itself. It keeps its magnetic helicity while shedding energy, and ends in ∇×B = λB (Woltjer, Taylor). In a sphere of radius a the lowest such state has λa = ${p.sphere_eigenvalue.toFixed(4)}. Each line is that exact field, traced: they wind around nested tori and never leave the sphere.</p>
      <p>Right: a Z-pinch, a column held by the magnetic field of its own current. Its balance, μ₀I²/8π = Nk(T<sub>e</sub>+T<sub>i</sub>) (Bennett), is the same equation that holds a gas filament together by its own gravity (Ostriker), with Gm² in place of μ₀e²u²/4π.</p>
      <dl>
        <dt>Spheromak λa<small>plasmoid::relaxation, first zero of j₁</small></dt><dd>${p.sphere_eigenvalue.toFixed(4)}</dd>
        <dt>Bennett temperature<small>1 MA, 10²⁰ ions/m, hydrogen</small></dt><dd>${(p.bennett_ev_1ma / 1000).toFixed(2)} keV</dd>
        <dt>Pease–Braginskii current<small>radiative collapse above it</small></dt><dd>${p.pease_braginskii_ma} MA</dd>
        <dt>Ostriker filament at 10 K<small>the gravitational twin</small></dt><dd>${p.ostriker_msun_pc} M☉/pc</dd>
        <dt>Magnetic ÷ gravitational binding<small>1 MA deuterium pinch at 2 keV</small></dt><dd>${fmt(p.magnetic_over_gravity, 2)}</dd>
      </dl>
      <p class="note">The equations are twins; the forces are not. In a laboratory pinch magnetism outweighs the plasma's own gravity by 10²⁷, so gravity plays no part in it. Gravity's one working route to fusion is a star, where it holds the plasma together for billions of years.</p>`;
  }
  return { scene, update, panelHtml, bind() {}, camera: [0, 1.1, 4.6], legend: [['Taylor-state field lines', css('--field')], ['pinch current', '#ffffff'], ['plasma column', css('--wave')]] };
}

// ---------- WARP ----------
function warpScene() {
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const l = new THREE.DirectionalLight(0xffffff, 0.8); l.position.set(2, 4, 3); scene.add(l);
  const n = 120, size = 6;
  const geo = new THREE.PlaneGeometry(size, size, n, n); geo.rotateX(-Math.PI / 2);
  const colors = new Float32Array((n + 1) * (n + 1) * 3); geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
  scene.add(mesh);
  const state = { R: 1.0, sigma: 4, v: 1, phase: 0 };
  // Alcubierre's York time: θ = v (x_s/r_s) df/dr_s; positive (expansion) behind, negative ahead.
  function surface() {
    const p = geo.attributes.position, { R, sigma } = state;
    const f = r => (Math.tanh(sigma * (r + R)) - Math.tanh(sigma * (r - R))) / (2 * Math.tanh(sigma * R));
    for (let k = 0; k < p.count; k++) {
      const x = p.getX(k), z = p.getZ(k), rs = Math.hypot(x, z) + 1e-9;
      const df = (f(rs + 1e-4) - f(rs - 1e-4)) / 2e-4;
      const th = state.v * (x / rs) * df * 0.35;
      p.setY(k, th);
      const c = th > 0 ? [1, 0.62, 0.25] : [0.33, 0.63, 1];
      const s = Math.min(1, Math.abs(th) * 2);
      colors.set([0.12 + (c[0] - 0.12) * s, 0.16 + (c[1] - 0.16) * s, 0.26 + (c[2] - 0.26) * s], 3 * k);
    }
    p.needsUpdate = true; geo.attributes.color.needsUpdate = true; geo.computeVertexNormals();
  }
  surface();
  const ship = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 10), new THREE.MeshBasicMaterial({ color: 0xffffff })); scene.add(ship);
  function update() {}
  // Pfenning & Ford: E = −(v²/12)(R²/Δ)c²/G for radius R, wall Δ, speed v (in c). Computed here
  // with the same formula gravitics uses; the page shows gravitics's own values for reference.
  const energy = (R, wall, v) => v * v / 12 * R * R / wall * 8.98755e16 / 6.6743e-11;
  function panelHtml() {
    const s = D.spacetime;
    return `
      <div><div class="crate">gravitics</div><h2>Warp: what a warp bubble costs</h2></div>
      <p>Alcubierre's bubble moves by contracting space ahead of it (blue, falling) and expanding space behind it (amber, rising). The surface is the expansion of space, his "York time". General relativity allows the shape; the price is negative energy concentrated in the bubble wall.</p>
      <div class="control"><label for="x-r">Bubble radius <output id="x-r-o">100 m</output></label><input id="x-r" type="range" min="0" max="4" step="0.05" value="2"></div>
      <div class="control"><label for="x-w">Wall thickness <output id="x-w-o"></output></label><input id="x-w" type="range" min="-33" max="2" step="0.5" value="0"></div>
      <div class="control"><label for="x-v">Speed <output id="x-v-o">1 c</output></label><input id="x-v" type="range" min="0.1" max="10" step="0.1" value="1"></div>
      <dl>
        <dt>Negative energy needed<small>as a mass, Pfenning & Ford Eq. 28</small></dt><dd id="x-e"></dd>
        <dt>Compared with</dt><dd id="x-cmp"></dd>
        <dt>Walls quantum fields allow<small>about 100 Planck lengths at v = c</small></dt><dd>${fmt(s.warp_100m_planck_kg, 2)} kg<small>for a 100 m bubble (gravitics)</small></dd>
        <dt>Quantum inequality, 1 ns<small>the most negative energy density allowed</small></dt><dd>${fmt(s.quantum_inequality_1ns, 2)} J/m³</dd>
      </dl>
      <p class="note">For reference, the same crate computes the Schwinger field (${fmt(s.schwinger_v_m, 3)} V/m, where light tears pairs from the vacuum), the Unruh temperature (${fmt(s.unruh_k_per_ms2, 3)} K per m/s² of acceleration) and a solar-mass black hole's Hawking temperature (${fmt(s.hawking_sun_k, 3)} K).</p>`;
  }
  function refresh() {
    const R = 10 ** +document.getElementById('x-r').value, wall = 10 ** +document.getElementById('x-w').value, v = +document.getElementById('x-v').value;
    const m = energy(R, wall, v), sun = 1.989e30;
    document.getElementById('x-r-o').textContent = `${fmt(R, 3)} m`;
    document.getElementById('x-w-o').textContent = `${fmt(wall, 2)} m`;
    document.getElementById('x-v-o').textContent = `${v} c`;
    document.getElementById('x-e').textContent = `${fmt(m, 3)} kg`;
    const refs = [[5.97e24, 'Earth'], [sun, 'the Sun'], [2e42, 'the Milky Way'], [1.5e53, 'all ordinary matter']];
    const ref = refs.filter(r => m >= r[0]).pop() || refs[0];
    document.getElementById('x-cmp').textContent = `${fmt(m / ref[0], 2)} × ${ref[1]}`;
    state.R = 0.4 + 0.25 * +document.getElementById('x-r').value; state.sigma = Math.max(1.2, 3 + 0.25 * (2 - +document.getElementById('x-w').value) / 3); state.v = Math.min(3, v);
    surface();
  }
  function bind() { for (const id of ['x-r', 'x-w', 'x-v']) document.getElementById(id).oninput = refresh; refresh(); }
  return { scene, update, panelHtml, bind, camera: [3.2, 3.4, 4.4], legend: [['space contracting', '#5aa1ff'], ['space expanding', '#ff9e40'], ['ship', '#ffffff']] };
}

// ---------- scene switching and the loop ----------
const scenes = { earth: earthScene(), waves: wavesScene(), plasma: plasmaScene(), warp: warpScene() };
let active = 'earth';
function show(name) {
  active = name;
  for (const b of document.querySelectorAll('.tabs button')) b.setAttribute('aria-selected', b.dataset.scene === name);
  const s = scenes[name];
  panel.innerHTML = s.panelHtml(); s.bind();
  setLegend(s.legend);
  camera.position.set(...s.camera); controls.target.set(0, 0, 0); controls.update();
  try { history.replaceState(null, '', '#' + name); } catch (e) { /* the viewer may refuse */ }
}
for (const b of document.querySelectorAll('.tabs button')) b.onclick = () => show(b.dataset.scene);
resize();
show(scenes[location.hash.slice(1)] ? location.hash.slice(1) : 'earth');
let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  scenes[active].update(dt);
  controls.update();
  renderer.render(scenes[active].scene, camera);
});
})();
</script>
