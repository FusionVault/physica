[workspace]
members = ["crates/*", "lab"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Daniel Garden"]
repository = "https://github.com/FusionVault/physica"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The spectral solvers run their tests at optimised speed; everything else keeps debug builds.
[profile.dev.package.geopotential]
opt-level = 3

[profile.dev.package.magnetics]
opt-level = 3
